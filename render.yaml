services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: resolveai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && chmod +x start.sh
    startCommand: bash start.sh
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: DATABASE_URL
        value: sqlite:///./resolveai.db
      - key: ALLOWED_ORIGINS
        value: https://resolveai.vercel.app,http://localhost:3000
    autoDeploy: true

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  - type: web
    name: resolveai-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: resolveai-backend
          property: host
          envVarKey: RENDER_EXTERNAL_URL
    autoDeploy: true
