services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: resolveai-backend
    runtime: python
    rootDir: backend
    pythonVersion: "3.12.0"
    buildCommand: pip install -r requirements.txt && chmod +x start.sh
    startCommand: bash start.sh
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: DATABASE_URL
        value: sqlite:///./resolveai.db
      - key: ALLOWED_ORIGINS
        value: https://resolveai-frontend.onrender.com,http://localhost:3000

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  - type: web
    name: resolveai-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
